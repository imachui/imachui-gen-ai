<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1120">
<title>Imachui Gen AI</title>
<!-- PDF.js for reading PDFs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Mammoth.js for reading Word (.docx) files -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* ===== PROFESSIONAL DARK THEME & GLASS UI ===== */
html, body {
  background-color: #0b1120;
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
:root {
  color-scheme: dark;
  --bg: #0b1120;
  --glass-bg: rgba(30, 41, 59, 0.45);
  --glass-border: rgba(255, 255, 255, 0.12);
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent2: #818cf8;
}
* { box-sizing: border-box; touch-action: manipulation; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); position: fixed; width: 100%; }
button { font: inherit; cursor: pointer; border: none; outline: none; }

/* iOS 27 Glass Style */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
}

/* ===== ANIMATIONS ===== */
@keyframes pulseGlow {
  0% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4), 0 0 20px rgba(129, 140, 248, 0.2); transform: scale(1); }
  50% { box-shadow: 0 0 30px rgba(56, 189, 248, 0.9), 0 0 60px rgba(129, 140, 248, 0.6); transform: scale(1.05); }
  100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4), 0 0 20px rgba(129, 140, 248, 0.2); transform: scale(1); }
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes textPulse {
  0% { text-shadow: 0 0 5px rgba(56, 189, 248, 0.3); color: #e2e8f0; }
  50% { text-shadow: 0 0 15px rgba(56, 189, 248, 0.8), 0 0 25px rgba(129, 140, 248, 0.6); color: #ffffff; }
  100% { text-shadow: 0 0 5px rgba(56, 189, 248, 0.3); color: #e2e8f0; }
}
@keyframes fireText {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes pulseBtn {
  0%, 100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.2); }
  50% { box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); border-color: rgba(56, 189, 248, 0.8); }
}

/* NEW: TWINKLING STAR ANIMATION FOR WELCOME TEXT */
@keyframes twinkleStars {
  0%, 100% { 
    text-shadow: 0 0 4px #fff, 0 0 10px #38bdf8, 0 0 20px #818cf8;
    filter: brightness(1);
    opacity: 0.9;
  }
  50% { 
    text-shadow: 0 0 8px #fff, 0 0 20px #38bdf8, 0 0 40px #818cf8, 0 0 60px #38bdf8;
    filter: brightness(1.5);
    opacity: 1;
  }
}

/* ===== LAYOUT ===== */
.app { height: 100vh; height: 100dvh; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; background-color: var(--bg); }
.sidebar { padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid var(--glass-border); overflow-y: auto; height: 100vh; height: 100dvh; }

.back-btn { 
  display: none; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
  color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-weight: 600; transition: all 0.3s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 15px rgba(0,0,0,0.2);
}
.back-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }

.brand { display: flex; align-items: center; gap: 12px; padding-bottom: 15px; }
.brand-icon { 
  width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #38bdf8, #818cf8, #0b1120); 
  display: grid; place-items: center; font-weight: 900; font-size: 24px; color: #fff; flex-shrink: 0; animation: pulseGlow 2s infinite ease-in-out;
}
.brand-name { font-weight: 850; font-size: 16px; animation: textPulse 2s infinite ease-in-out; }
.brand-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

.side-btn { width: 100%; padding: 14px; border-radius: 14px; color: var(--text); text-align: left; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); transition: all 0.3s; cursor: pointer; }
.side-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); }
.ask-btn { animation: pulseBtn 3s infinite; }

.side-label { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-top: 10px; }
.history { display: flex; flex-direction: column; gap: 8px; max-height: 30vh; overflow-y: auto; }
.history-row { display: flex; align-items: center; gap: 6px; border-radius: 10px; }
.history-row.active { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); }
.history-open { flex: 1; text-align: left; border: 0; background: transparent; color: #cbd2e4; padding: 12px 10px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.del-btn { border: 0; background: transparent; color: #a4abc0; padding: 8px; font-size: 14px; cursor: pointer; }
.del-btn:hover { background: rgba(255,0,0,0.2); color: #ff9bac; border-radius: 8px; }
.status { font-size: 11px; padding: 8px; border-radius: 8px; text-align: center; background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
.backup-row { display: flex; gap: 6px; }
.backup-row button { flex: 1; padding: 10px; font-size: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; }
.backup-row button:hover { background: rgba(56, 189, 248, 0.2); }

.side-foot { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--glass-border); font-size: 12px; font-weight: bold; text-align: center; }
.fire-text {
  background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #ff0000); background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: fireText 3s ease infinite; font-size: 14px;
}

.main { display: flex; flex-direction: column; overflow: hidden; height: 100vh; height: 100dvh; background-color: var(--bg); }
.topbar { height: 70px; display: flex; align-items: center; gap: 12px; padding: 0 30px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
.menu-btn { display: none; background: transparent; border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; padding: 8px 12px; font-size: 16px; cursor: pointer; }
.top-title { font-size: 15px; font-weight: 850; animation: textPulse 2s infinite ease-in-out; }
.gradient { 
  background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8); background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientShift 3s linear infinite;
}

/* APPLY TWINKLE ANIMATION HERE */
.star-twinkle {
  animation: twinkleStars 2s infinite ease-in-out alternate;
}

/* CHAT AREA & DRAG/DROP */
.chat { 
  flex: 1; overflow-y: auto; padding: 30px 24px; display: flex; flex-direction: column; align-items: center; 
  -webkit-overflow-scrolling: touch; transition: background 0.3s; 
}
.chat.drag-over { background: rgba(56, 189, 248, 0.05); border: 2px dashed var(--accent); }
.chat > * { width: 100%; max-width: 850px; }
.welcome { text-align: center; padding: 60px 0 40px; }
.welcome h1 { font-size: clamp(28px, 4vw, 42px); margin: 0 0 15px; font-weight: 800; }
.welcome p { color: var(--muted); font-size: 15px; max-width: 560px; margin: 0 auto; }

.msg { display: flex; gap: 16px; margin: 24px 0; }
.avatar { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.msg.user .avatar { background: rgba(56, 189, 248, 0.2); }
.body { flex: 1; padding: 16px 20px; border-radius: 16px; line-height: 1.75; background: var(--glass-bg); border: 1px solid var(--glass-border); min-width: 0; backdrop-filter: blur(10px); }
.role { font-size: 12px; font-weight: 800; margin-bottom: 6px; color: var(--accent); text-transform: uppercase; }
.msg.user .role { color: var(--accent2); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.text a { color: var(--accent); text-decoration: underline; word-break: break-all; }
.text strong { color: #fff; }
.prov { font-size: 10px; color: #8f9bb5; margin-bottom: 8px; }
.read-row { margin-top: 12px; }
.read-btn { border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: #fff; border-radius: 10px; padding: 8px 14px; font-size: 12px; cursor: pointer; }
.read-btn:hover { background: rgba(56, 189, 248, 0.2); }
.att-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.att-chip { font-size: 11px; color:#c9d1e6; border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px 10px; background: rgba(255,255,255,0.03); }
.att-img { max-width: 100%; max-height: 250px; border-radius: 12px; margin-top: 12px; }
.typing { color: var(--accent); font-size: 13px; font-weight: 700; }

.composer-wrap { padding: 20px 24px 30px; display: flex; justify-content: center; flex-shrink: 0; background: transparent; }
.composer { width: 100%; max-width: 850px; padding: 16px; border-radius: 24px; display: flex; flex-direction: column; gap: 12px; }
#prompt { width: 100%; min-height: 60px; max-height: 200px; resize: vertical; border: 0; outline: 0; color: #fff; background: transparent; padding: 8px 12px; line-height: 1.6; font-size: 15px; }
#prompt::placeholder { color: #6b7385; }
.composer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--glass-border); }
.tools, .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tool { border: 1px solid var(--glass-border); border-radius: 12px; padding: 10px 14px; background: rgba(255,255,255,0.05); color: #fff; font-size: 12px; cursor: pointer; }
.tool:hover { background: rgba(56, 189, 248, 0.2); }
.send { border: 0; border-radius: 12px; padding: 12px 24px; color: #05070a; background: linear-gradient(135deg, var(--accent), var(--accent2)); font-weight: 850; font-size: 14px; cursor: pointer; }
.send:hover { box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
.toggle-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
.toggle-label input { accent-color: var(--accent); width: 16px; height: 16px; }

@media(max-width:768px){
  .app { grid-template-columns: 1fr; height: 100vh; height: 100dvh; }
  .sidebar { display: none; position: fixed; z-index: 50; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--bg); padding: 16px 14px; overflow-y: auto; }
  .sidebar.open { display: flex; }
  .sidebar.open ~ .main { display: none; }
  .back-btn { display: block; }
  .menu-btn { display: block; }
  .topbar { height: 58px; padding: 0 14px; gap: 10px; }
  .top-title { font-size: 12px; flex: 1; }
  .chat { padding: 18px 12px 24px; }
  .composer-wrap { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; padding: 10px 10px max(10px,env(safe-area-inset-bottom)) 10px; z-index: 100; background: linear-gradient(0deg, var(--bg) 70%, transparent 100%); }
  .chat { padding-bottom: 220px; }
  .composer { padding: 10px; border-radius: 18px; background: rgba(30, 41, 59, 0.9); }
  #prompt { min-height: 48px; font-size: 16px; padding: 8px; }
  .composer-bottom { flex-direction: column; align-items: stretch; gap: 8px; }
  .tools { justify-content: space-between; width: 100%; }
  .tool { padding: 10px 12px; font-size: 12px; flex: 1; text-align: center; }
  .actions { width: 100%; }
  .send { width: 100%; padding: 14px; font-size: 16px; font-weight: 900; }
  .msg { gap: 10px; margin: 16px 0; }
  .avatar { width: 32px; height: 32px; flex: 0 0 32px; font-size: 11px; }
  .body { padding: 12px 14px; font-size: 14px; }
  .welcome h1 { font-size: 28px; }
  .welcome p { font-size: 13px; }
}
</style>
</head>
<body>
<div class="app" id="appRoot">
<aside class="sidebar glass" id="sidebar">
  <button class="back-btn" id="backBtn" onclick="closeSidebar()">← Back to Chat</button>
  <div class="brand">
    <div class="brand-icon">✦</div>
    <div><div class="brand-name">IMACHUI GEN AI</div><div class="brand-sub">by Imachui</div></div>
  </div>
  <button class="side-btn" onclick="newChat();closeSidebar()">＋ New Conversation</button>
  <div class="side-label">Workspace</div>
  <button class="side-btn ask-btn" onclick="document.getElementById('prompt').focus();closeSidebar()">✦ Ask Imachui Gen AI</button>
  <div class="side-label">Recent Conversations</div>
  <div class="history" id="history"></div>
  
  <div class="status" id="status">Loading...</div>
  
  <div class="backup-row">
    <button id="downloadBtn" onclick="downloadBackup()">💾 Download</button>
    <button id="uploadBtn" onclick="document.getElementById('uploadInput').click()">📂 Upload</button>
  </div>
  <input type="file" id="uploadInput" accept=".json" style="display:none" onchange="handleUpload(event)">
  
  <div class="side-foot">
    Imachui Gen AI<br>
    <span class="fire-text">The Supreme Intelligence.</span>
  </div>
</aside>

<main class="main">
<header class="topbar glass">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <div class="top-title">IMACHUI GEN AI / <span class="gradient">GLOBAL KING</span></div>
</header>
<section class="chat" id="chat">
  <div class="welcome" id="welcome">
    <div class="brand-icon" style="margin:0 auto 20px;width:80px;height:80px;font-size:40px">✦</div>
    <!-- Inapply ang star-twinkle class dito para kumislap parang bituin -->
    <h1>Welcome to <span class="gradient star-twinkle">Imachui Gen AI</span></h1>
    <p>I am the Global King. I absorb the intelligence of multiple AI models to give you massive, powerful, and flawless answers.</p>
  </div>
  <div id="messages"></div>
</section>
<div class="composer-wrap">
<form class="composer glass" id="composer" onsubmit="event.preventDefault();sendMessage();">
  <textarea id="prompt" rows="2" placeholder="Message Imachui Gen AI..." maxlength="12000"></textarea>
  <div class="att-list" id="attachments"></div>
  <div class="composer-bottom">
    <div class="tools">
      <button type="button" class="tool" onclick="document.getElementById('fileInput').click()">＋ Attach</button>
      <input type="file" id="fileInput" multiple accept="image/*,.pdf,.docx,.txt,.csv,.json" style="display:none" onchange="handleFiles(event)">
      <button type="button" class="tool" onclick="toggleMic()" id="micBtn">🎙️ Mic</button>
      <label class="toggle-label"><input type="checkbox" id="autoRead" checked> Auto-Read</label>
    </div>
    <div class="actions"><button type="submit" class="send" id="sendBtn">Send ↑</button></div>
  </div>
</form>
</div>
</main>
</div>

<script>
'use strict';

// Set PDF.js Worker
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// MESSENGER AUTO-REDIRECT
var ua = navigator.userAgent || navigator.vendor || window.opera;
var isMessenger = /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line|LinkedInApp|Twitter|Telegram|WhatsApp/i.test(ua);
var isAndroid = /Android/i.test(ua);
var isIOS = /iPhone|iPad|iPod/i.test(ua);

if (isMessenger) {
  var targetUrl = window.location.href.split('#')[0];
  try {
    if (isAndroid) {
      var cleanUrl = targetUrl.replace(/^https?:\/\//, '');
      window.location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';
      setTimeout(function() { window.location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;end'; }, 1000);
    } else if (isIOS) {
      var chromeUrl = 'googlechrome://' + targetUrl.replace(/^https?:\/\//, '');
      window.location.href = chromeUrl;
      setTimeout(function() { window.location.href = targetUrl; }, 1500);
    }
  } catch(e) { console.error('Redirect failed'); }
}

// APP LOGIC
var STORAGE_KEY = 'imachui_v36_data';
var chats = [];
var activeChatId = null;
var currentMessages = [];
var busy = false;
var selectedFiles = [];
var recognition = null;
var listening = false;
var synth = window.speechSynthesis;
var voices = [];

function loadVoices() { voices = synth.getVoices(); if (voices.length === 0) setTimeout(loadVoices, 200); }
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
loadVoices();

var storageOK = false;
try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); storageOK = true; } catch(e) { storageOK = false; }

function load() {
  if (!storageOK) return;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    chats = d.chats || [];
    activeChatId = d.activeChatId || null;
  } catch(e) { console.error(e); }
}

function save() {
  if (!storageOK) { updateStatus(); return; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({chats: chats, activeChatId: activeChatId}));
    updateStatus();
  } catch(e) { console.error(e); }
}

function updateStatus() {
  var el = document.getElementById('status');
  if (!el) return;
  if (storageOK) { el.textContent = '✅ Saved ' + chats.length + ' chats'; el.style.color = '#38bdf8'; }
  else { el.textContent = '❌ Storage not available'; el.style.color = '#ff8d9a'; }
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

function downloadBackup() {
  try {
    var data = JSON.stringify({chats: chats, activeChatId: activeChatId}, null, 2);
    var blob = new Blob([data], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'imachui-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    alert('✅ Downloaded! ' + chats.length + ' chats saved.');
  } catch(e) { alert('❌ Download error: ' + e.message); }
}

function handleUpload(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var parsed = JSON.parse(ev.target.result);
      if (!parsed.chats || !Array.isArray(parsed.chats)) { alert('❌ Invalid file format.'); return; }
      chats = parsed.chats; activeChatId = parsed.activeChatId || (chats[0] ? chats[0].id : null);
      save(); renderHistory();
      if (activeChatId) openChat(activeChatId); else newChat();
      alert('✅ Restored ' + chats.length + ' conversations!');
    } catch(err) { alert('❌ Error: ' + err.message); }
  };
  reader.readAsText(file);
  document.getElementById('uploadInput').value = '';
}

function fmt(text) {
  var f = text;
  f = f.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  f = f.replace(/\[([^\]]+)\]\((https?:\/\/[^\s<]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  f = f.replace(/(^|[^"'])((?:https?:\/\/|www\.)[^\s<]+)/g, function(m,p,u) {
    return p + '<a href="' + (/^https?:\/\//i.test(u) ? u : 'https://' + u) + '" target="_blank">' + u + '</a>';
  });
  return f;
}

function speak(text, btn) {
  if (!synth) { if (btn) btn.textContent = '🔊 Read Aloud'; return; }
  try {
    synth.cancel();
    var clean = String(text || '').replace(/<[^>]*>/g, ' ').replace(/https?:\/\/\S+/g, ' link ').replace(/\s+/g, ' ').trim();
    if (!clean) { if (btn) btn.textContent = '🔊 Read Aloud'; return; }
    if (voices.length === 0) voices = synth.getVoices();
    var u = new SpeechSynthesisUtterance(clean.slice(0, 12000));
    u.lang = 'en-US'; u.rate = 1.0; u.pitch = 1.0;
    var pv = voices.find(function(v) { return /en-(US|GB)|fil-PH/i.test(v.lang) && /female|zira|samantha|aria|jenny/i.test(v.name); }) || voices.find(function(v) { return /en-(US|GB)|fil-PH/i.test(v.lang); });
    if (pv) u.voice = pv;
    u.onstart = function() { if (btn) btn.textContent = '⏹️ Stop'; };
    u.onend = function() { if (btn) btn.textContent = '🔊 Read Aloud'; };
    u.onerror = function() { if (btn) btn.textContent = '🔊 Read Aloud'; };
    synth.speak(u);
  } catch(e) { if (btn) btn.textContent = '🔊 Read Aloud'; }
}

function toggleMic() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech Recognition not supported. Use Chrome.'); return; }
  var btn = document.getElementById('micBtn');
  if (listening) { if (recognition) recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'en-US'; recognition.continuous = true; recognition.interimResults = true;
  recognition.onstart = function() { listening = true; btn.textContent = '⏹️ Stop'; };
  recognition.onresult = function(e) {
    var t = '';
    for (var i = e.resultIndex; i < e.results.length; i++) { if (e.results[i].isFinal) t += e.results[i][0].transcript; }
    if (t) document.getElementById('prompt').value = t;
  };
  recognition.onerror = function() { listening = false; btn.textContent = '🎙️ Mic'; };
  recognition.onend = function() { listening = false; btn.textContent = '🎙️ Mic'; };
  try { recognition.start(); } catch(e) { listening = false; btn.textContent = '🎙️ Mic'; }
}

function newChat() {
  var chat = {id: 'c' + Date.now() + Math.random().toString(36).slice(2,6), title: 'New conversation', updated: Date.now(), messages: []};
  chats.unshift(chat); activeChatId = chat.id; currentMessages = [];
  document.getElementById('messages').innerHTML = '';
  document.getElementById('welcome').style.display = 'block';
  save(); renderHistory();
  setTimeout(function() { document.getElementById('prompt').focus(); }, 100);
}

function renderHistory() {
  var h = document.getElementById('history');
  h.innerHTML = '';
  chats.slice(0, 30).forEach(function(chat) {
    var row = document.createElement('div');
    row.className = 'history-row' + (chat.id === activeChatId ? ' active' : '');
    var open = document.createElement('button');
    open.className = 'history-open'; open.textContent = chat.title || 'New conversation';
    open.onclick = function() { openChat(chat.id); };
    var del = document.createElement('button');
    del.className = 'del-btn'; del.textContent = '×';
    del.onclick = function(ev) { ev.stopPropagation(); deleteChat(chat.id); };
    row.appendChild(open); row.appendChild(del); h.appendChild(row);
  });
}

function openChat(id) {
  var chat = null;
  for (var i = 0; i < chats.length; i++) if (chats[i].id === id) chat = chats[i];
  if (!chat) return;
  activeChatId = chat.id; save();
  currentMessages = (chat.messages || []).map(function(m) { return {role: m.role, content: m.content}; });
  document.getElementById('messages').innerHTML = '';
  document.getElementById('welcome').style.display = currentMessages.length > 0 ? 'none' : 'block';
  currentMessages.forEach(function(m) {
    var display = Array.isArray(m.content) ? ((m.content.find(function(c) { return c.type === 'text'; }) || {}).text || '') : m.content;
    addMessage(m.role, display);
  });
  renderHistory(); closeSidebar(); scrollBottom();
}

function deleteChat(id) {
  if (!confirm('Delete this conversation?')) return;
  chats = chats.filter(function(c) { return c.id !== id; });
  if (activeChatId === id) { activeChatId = null; currentMessages = []; document.getElementById('messages').innerHTML = ''; document.getElementById('welcome').style.display = 'block'; }
  save(); renderHistory();
  if (!activeChatId && chats.length) openChat(chats[0].id); else if (!chats.length) newChat();
}

function scrollBottom() {
  setTimeout(function() { var c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight; }, 100);
}

function addMessage(role, content, options) {
  options = options || {};
  document.getElementById('welcome').style.display = 'none';
  var art = document.createElement('article');
  art.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
  var av = document.createElement('div'); av.className = 'avatar'; av.textContent = role === 'user' ? 'YOU' : 'AI';
  var body = document.createElement('div'); body.className = 'body';
  var lab = document.createElement('div'); lab.className = 'role'; lab.textContent = role === 'user' ? 'You' : 'Imachui Gen AI';
  body.appendChild(lab);
  if (role === 'assistant') {
    var p = document.createElement('div'); p.className = 'prov'; p.textContent = '● Imachui Gen AI : Global King'; body.appendChild(p);
  }
  var t = document.createElement('div'); t.className = 'text'; if (content) t.innerHTML = fmt(content); body.appendChild(t);
  if (options.images && options.images.length) {
    options.images.forEach(function(url) { var img = document.createElement('img'); img.src = url; img.className = 'att-img'; body.appendChild(img); });
  }
  if (role === 'assistant' && content) {
    var rr = document.createElement('div'); rr.className = 'read-row';
    var rd = document.createElement('button'); rd.className = 'read-btn'; rd.textContent = '🔊 Read Aloud';
    rd.onclick = function() { if (synth.speaking) { synth.cancel(); rd.textContent = '🔊 Read Aloud'; } else speak(t.textContent, rd); };
    rr.appendChild(rd); body.appendChild(rr);
  }
  art.appendChild(av); art.appendChild(body); document.getElementById('messages').appendChild(art);
  scrollBottom(); return art;
}

function handleFiles(event) {
  var files = Array.from(event.target.files || []);
  files.forEach(function(f) { selectedFiles.push(f); });
  if (selectedFiles.length > 3) selectedFiles = selectedFiles.slice(0, 3);
  renderAttachments(); event.target.value = '';
}

function renderAttachments() {
  var ae = document.getElementById('attachments'); ae.innerHTML = '';
  selectedFiles.forEach(function(f, i) {
    var chip = document.createElement('span'); chip.className = 'att-chip'; chip.textContent = '📎 ' + f.name;
    var rm = document.createElement('button'); rm.textContent = ' ×'; rm.style.cssText = 'border:0;background:transparent;color:#ffb0bd;cursor:pointer';
    rm.onclick = function() { selectedFiles.splice(i, 1); renderAttachments(); };
    chip.appendChild(rm); ae.appendChild(chip);
  });
}

// FIXED: Better Image Resizing for Mobile
function resizeImg(file) {
  return new Promise(function(resolve, reject) {
    var r = new FileReader();
    r.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height; 
        var max = 1024; // Max dimension
        if (w > h && w > max) { h *= max / w; w = max; } 
        else if (h > max) { w *= max / h; h = max; }
        
        var c = document.createElement('canvas'); 
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h); 
        
        try {
          resolve(c.toDataURL('image/jpeg', 0.8));
        } catch(err) {
          reject(new Error('Image too large to process on this device.'));
        }
      };
      img.onerror = function() { reject(new Error('Could not load image.')); };
      img.src = e.target.result;
    };
    r.onerror = function() { reject(new Error('Could not read file.')); };
    r.readAsDataURL(file);
  });
}

// PDF Text Extraction Function
async function extractPdfText(file) {
  var arrayBuffer = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  var fullText = '';
  for (var i = 1; i <= pdf.numPages; i++) {
    var page = await pdf.getPage(i);
    var textContent = await page.getTextContent();
    var pageText = textContent.items.map(function(item) { return item.str; }).join(' ');
    fullText += '[Page ' + i + ']\n' + pageText + '\n\n';
  }
  return fullText.trim();
}

// Word (.docx) Text Extraction Function
async function extractDocxText(file) {
  var arrayBuffer = await file.arrayBuffer();
  var result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
  return result.value;
}

async function sendMessage() {
  var promptEl = document.getElementById('prompt');
  var text = promptEl.value.trim();
  if ((!text && !selectedFiles.length) || busy) return;
  if (!activeChatId) newChat();
  busy = true; document.getElementById('sendBtn').disabled = true; promptEl.disabled = true;
  
  var fileSnap = selectedFiles.slice(); var msgContent = [];
  if (text) msgContent.push({type: 'text', text: text});
  
  // Process files with strict mobile error handling
  for (var i = 0; i < fileSnap.length; i++) {
    var f = fileSnap[i];
    var fileSizeMB = (f.size / (1024 * 1024)).toFixed(2);
    
    // Warn if file is too large for mobile processing
    if (f.size > 10 * 1024 * 1024) {
      msgContent.push({type: 'text', text: '\n\n[Error: ' + f.name + ' is too large (' + fileSizeMB + 'MB). Max size is 10MB.]'});
      continue;
    }

    try {
      var name = f.name.toLowerCase();
      if (f.type.indexOf('image/') === 0 || name.match(/\.(jpg|jpeg|png|webp|gif)$/)) { 
        var data = await resizeImg(f); 
        msgContent.push({type: 'image', image: data}); 
      } else if (f.type === 'application/pdf' || name.endsWith('.pdf')) {
        var pdfText = await extractPdfText(f);
        msgContent.push({type: 'text', text: '\n\n[PDF Document: ' + f.name + ']\n' + pdfText});
      } else if (name.endsWith('.docx')) {
        var docxText = await extractDocxText(f);
        msgContent.push({type: 'text', text: '\n\n[Word Document: ' + f.name + ']\n' + docxText});
      } else { 
        var txt = await f.text(); 
        msgContent.push({type: 'text', text: '\n\n[Document: ' + f.name + ']\n' + txt}); 
      }
    } catch(e) { 
      console.error(e); 
      msgContent.push({type: 'text', text: '\n\n[Error reading file ' + f.name + ': ' + (e.message || 'Unknown error') + ']'});
    }
  }
  
  addMessage('user', text || 'Please review my attachment(s).', { images: msgContent.filter(function(c) { return c.type === 'image'; }).map(function(c) { return c.image; }) });
  currentMessages.push({role: 'user', content: msgContent});
  
  var chat = null;
  for (var j = 0; j < chats.length; j++) if (chats[j].id === activeChatId) chat = chats[j];
  if (chat) {
    chat.messages.push({role: 'user', content: msgContent});
    if (chat.title === 'New conversation') chat.title = (text || fileSnap[0].name || 'Attachment').slice(0, 40);
    chat.updated = Date.now(); save(); renderHistory();
  }
  
  promptEl.value = ''; selectedFiles = []; renderAttachments();
  
  var am = addMessage('assistant', '');
  var te = am.querySelector('.text');
  te.innerHTML = '<span class="typing">Consulting the AI brains...</span>';
  
  try {
    var API_URL = location.hostname === 'imachui.github.io' ? 'https://imachui-gen-ai.vercel.app/api/chat' : '/api/chat';
    var resp = await fetch(API_URL, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, messages: currentMessages.slice(-20)})
    });
    if (!resp.ok) { var err = await resp.json().catch(function() { return {}; }); throw new Error(err.error || 'API error (' + resp.status + ')'); }
    var reader = resp.body.getReader(); var dec = new TextDecoder(); var full = '';
    te.textContent = '';
    while (true) {
      var r = await reader.read(); if (r.done) break;
      full += dec.decode(r.value, { stream: true }); te.textContent = full; scrollBottom();
    }
    if (!full.trim()) throw new Error('Empty answer.');
    te.innerHTML = fmt(full);
    var rr = document.createElement('div'); rr.className = 'read-row';
    var rd = document.createElement('button'); rd.className = 'read-btn'; rd.textContent = '🔊 Read Aloud';
    rd.onclick = function() { if (synth.speaking) { synth.cancel(); rd.textContent = '🔊 Read Aloud'; } else speak(te.textContent, rd); };
    rr.appendChild(rd); am.querySelector('.body').appendChild(rr);
    if (document.getElementById('autoRead').checked) { setTimeout(function() { speak(te.textContent, rd); }, 300); }
    currentMessages.push({role: 'assistant', content: full});
    if (chat) { chat.messages.push({role: 'assistant', content: full}); chat.updated = Date.now(); save(); }
  } catch(e) {
    te.textContent = 'System Error: ' + (e.message || 'Try again.');
  } finally {
    busy = false; document.getElementById('sendBtn').disabled = false; promptEl.disabled = false;
    if (window.innerWidth > 768) promptEl.focus();
  }
}

// ===== DRAG AND DROP LOGIC =====
var chatArea = document.getElementById('chat');
chatArea.addEventListener('dragover', function(e) {
  e.preventDefault();
  chatArea.classList.add('drag-over');
});
chatArea.addEventListener('dragleave', function(e) {
  e.preventDefault();
  chatArea.classList.remove('drag-over');
});
chatArea.addEventListener('drop', function(e) {
  e.preventDefault();
  chatArea.classList.remove('drag-over');
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    var files = Array.from(e.dataTransfer.files);
    files.forEach(function(f) { selectedFiles.push(f); });
    if (selectedFiles.length > 3) selectedFiles = selectedFiles.slice(0, 3);
    renderAttachments();
  }
});

// ===== GLOBAL PASTE LOGIC (Ctrl+V anywhere) =====
document.addEventListener('paste', function(e) {
  var items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (var i = 0; i < items.length; i++) {
    if (items[i].kind === 'file') {
      var blob = items[i].getAsFile();
      if (blob) {
        var file = new File([blob], 'pasted_file_' + Date.now() + '.png', { type: blob.type });
        selectedFiles.push(file);
        if (selectedFiles.length > 3) selectedFiles = selectedFiles.slice(0, 3);
        renderAttachments();
        e.preventDefault();
      }
    }
  }
});

window.addEventListener('beforeunload', save);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'hidden') save(); });

load(); updateStatus();
if (chats.length > 0) {
  chats.sort(function(a,b) { return (b.updated||0) - (a.updated||0); });
  var toOpen = activeChatId; var found = false;
  for (var i = 0; i < chats.length; i++) if (chats[i].id === toOpen) found = true;
  if (!found) toOpen = chats[0].id;
  openChat(toOpen);
} else { newChat(); }
</script>
